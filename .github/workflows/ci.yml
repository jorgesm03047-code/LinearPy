name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar formato
        run: npm run format:check

      - name: Comprobar comentarios
        run: npm run check:comments

      - name: Ejecutar pruebas unitarias matemáticas
        run: npm test

      - name: Compilar para producción (Cloudflare Pages)
        run: npm run build
